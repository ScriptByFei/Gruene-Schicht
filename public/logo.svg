<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Kalender-Form mit abgerundeten Ecken -->
    <clipPath id="calendar-clip">
      <rect x="16" y="24" width="96" height="88" rx="14" ry="14"/>
    </clipPath>
    
    <!-- Gradient für den Hintergrund -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    
    <!-- Schatten für Tiefe -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Glühen für den Blatt-Effekt -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Kalender-Grundform -->
  <rect x="16" y="24" width="96" height="88" rx="14" ry="14" fill="url(#bg-grad)" filter="url(#shadow)"/>
  
  <!-- Obere Bindung/Header des Kalenders -->
  <rect x="16" y="24" width="96" height="28" rx="14" ry="14" fill="#065f46"/>
  <rect x="16" y="42" width="96" height="10" fill="#065f46"/>
  
  <!-- Kleine Ringe/Binder oben -->
  <circle cx="42" cy="24" r="4" fill="#1f2937"/>
  <circle cx="86" cy="24" r="4" fill="#1f2937"/>
  <rect x="40" y="20" width="4" height="8" rx="2" fill="#d1d5db"/>
  <rect x="84" y="20" width="4" height="8" rx="2" fill="#d1d5db"/>
  
  <!-- Schicht-Indikatoren als kleine farbige Kreise -->
  <!-- Früh (F) - obere Zeile -->
  <circle cx="38" cy="66" r="6" fill="#fbbf24"/>
  <circle cx="62" cy="66" r="6" fill="#fbbf24"/>
  <circle cx="86" cy="66" r="6" fill="#fbbf24"/>
  
  <!-- Spät (S) - mittlere Zeile -->
  <circle cx="38" cy="86" r="6" fill="#ef4444"/>
  <circle cx="62" cy="86" r="6" fill="#ef4444"/>
  <text x="62" y="90" font-size="7" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, sans-serif">F</text>
  
  <!-- Nacht (N) - untere Zeile -->
  <circle cx="38" cy="94" r="6" fill="#3b82f6"/>
  <circle cx="86" cy="94" r="6" fill="#3b82f6"/>
  
  <!-- Grünes Blatt-Symbol oben rechts als Akzent -->
  <g transform="translate(88, 36)" filter="url(#glow)">
    <path d="M 8 0 C 16 4, 20 14, 8 24 C -4 14, 0 4, 8 0 Z" fill="#a7f3d0"/>
    <path d="M 8 3 C 14 7, 16 13, 8 20 C 0 13, 2 7, 8 3 Z" fill="#34d399"/>
    <line x1="8" y1="4" x2="8" y2="20" stroke="#059669" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>